<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="mt-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#3a2a1e"/>
      <stop offset="1" stop-color="#1c130d"/>
    </radialGradient>
    <radialGradient id="mt-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mt-plate" cx="42%" cy="38%" r="65%">
      <stop offset="0" stop-color="#fdf6e8"/>
      <stop offset="0.65" stop-color="#eadfc4"/>
      <stop offset="1" stop-color="#c9b98f"/>
    </radialGradient>
    <radialGradient id="mt-dumpling" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#f6e4b8"/>
      <stop offset="1" stop-color="#d9b878"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#mt-bg)"/>
  <ellipse cx="200" cy="330" rx="140" ry="26" fill="url(#mt-shadow)"/>
  <circle cx="200" cy="200" r="168" fill="url(#mt-plate)"/>
  <circle cx="200" cy="200" r="168" fill="none" stroke="#C9A15A" stroke-width="3"/>
  <circle cx="200" cy="200" r="152" fill="none" stroke="#3F8F87" stroke-width="1.5" opacity="0.5"/>
  <!-- manty dumplings, pinched top pouches -->
  <g>
    <g transform="translate(150,175)">
      <ellipse cx="0" cy="18" rx="38" ry="26" fill="url(#mt-dumpling)"/>
      <path d="M-30,4 Q0,-28 30,4 Q15,-8 0,-14 Q-15,-8 -30,4 Z" fill="#eccd8f"/>
      <path d="M0,-14 L0,-2 M-15,-8 L-8,4 M15,-8 L8,4 M-25,0 L-16,10 M25,0 L16,10" stroke="#b8905a" stroke-width="1.2" opacity="0.7" fill="none"/>
      <circle cx="0" cy="-13" r="2" fill="#b8905a"/>
    </g>
    <g transform="translate(240,180)">
      <ellipse cx="0" cy="18" rx="40" ry="27" fill="url(#mt-dumpling)"/>
      <path d="M-32,4 Q0,-30 32,4 Q16,-9 0,-15 Q-16,-9 -32,4 Z" fill="#eccd8f"/>
      <path d="M0,-15 L0,-2 M-16,-9 L-8,4 M16,-9 L8,4 M-27,0 L-17,11 M27,0 L17,11" stroke="#b8905a" stroke-width="1.2" opacity="0.7" fill="none"/>
      <circle cx="0" cy="-14" r="2" fill="#b8905a"/>
    </g>
    <g transform="translate(195,245)">
      <ellipse cx="0" cy="18" rx="42" ry="28" fill="url(#mt-dumpling)"/>
      <path d="M-33,4 Q0,-31 33,4 Q17,-10 0,-16 Q-17,-10 -33,4 Z" fill="#eccd8f"/>
      <path d="M0,-16 L0,-2 M-17,-10 L-8,4 M17,-10 L8,4 M-28,0 L-18,11 M28,0 L18,11" stroke="#b8905a" stroke-width="1.2" opacity="0.7" fill="none"/>
      <circle cx="0" cy="-15" r="2" fill="#b8905a"/>
    </g>
  </g>
  <!-- pepper dust -->
  <g fill="#5a3a20" opacity="0.6">
    <circle cx="140" cy="190" r="1.3"/><circle cx="165" cy="165" r="1.3"/><circle cx="230" cy="170" r="1.3"/>
    <circle cx="255" cy="195" r="1.3"/><circle cx="190" cy="240" r="1.3"/><circle cx="215" cy="260" r="1.3"/>
  </g>
  <!-- herb garnish -->
  <path d="M120,255 Q135,235 155,250 Q140,245 120,255Z" fill="#5a7c3a"/>
</svg>
