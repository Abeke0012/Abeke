<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="lg-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#3a2a1e"/>
      <stop offset="1" stop-color="#1c130d"/>
    </radialGradient>
    <radialGradient id="lg-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lg-plate" cx="42%" cy="38%" r="65%">
      <stop offset="0" stop-color="#fdf6e8"/>
      <stop offset="0.65" stop-color="#eadfc4"/>
      <stop offset="1" stop-color="#c9b98f"/>
    </radialGradient>
    <linearGradient id="lg-noodle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d98a"/>
      <stop offset="1" stop-color="#d9a95a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#lg-bg)"/>
  <ellipse cx="200" cy="330" rx="140" ry="26" fill="url(#lg-shadow)"/>
  <circle cx="200" cy="200" r="168" fill="url(#lg-plate)"/>
  <circle cx="200" cy="200" r="168" fill="none" stroke="#C9A15A" stroke-width="3"/>
  <circle cx="200" cy="200" r="152" fill="none" stroke="#3F8F87" stroke-width="1.5" opacity="0.5"/>
  <g fill="none" stroke="#C9A15A" stroke-width="1" opacity="0.6">
    <circle cx="200" cy="200" r="160"/>
  </g>
  <!-- noodle mound -->
  <g stroke="url(#lg-noodle)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M90,210 C130,180 150,230 190,200 C230,170 250,220 300,195"/>
    <path d="M100,190 C140,225 160,175 205,205 C245,230 265,185 295,215"/>
    <path d="M95,230 C135,200 165,245 200,220 C235,195 260,235 290,205"/>
    <path d="M110,170 C150,200 175,160 210,185 C245,205 260,170 285,190"/>
    <path d="M105,245 C145,215 175,255 210,235 C245,215 255,250 280,230"/>
  </g>
  <!-- meat chunks -->
  <g fill="#7a4326">
    <ellipse cx="150" cy="195" rx="14" ry="10" transform="rotate(-15 150 195)"/>
    <ellipse cx="240" cy="180" rx="13" ry="9" transform="rotate(20 240 180)"/>
    <ellipse cx="215" cy="245" rx="14" ry="10" transform="rotate(-10 215 245)"/>
    <ellipse cx="175" cy="235" rx="12" ry="9" transform="rotate(30 175 235)"/>
  </g>
  <!-- peppers / veg -->
  <g fill="#C1502E">
    <rect x="160" y="170" width="22" height="6" rx="3" transform="rotate(25 160 170)"/>
    <rect x="230" y="215" width="20" height="6" rx="3" transform="rotate(-20 230 215)"/>
    <rect x="190" y="255" width="18" height="6" rx="3" transform="rotate(10 190 255)"/>
  </g>
  <g fill="#3F8F87">
    <rect x="140" y="220" width="18" height="5" rx="2.5" transform="rotate(-30 140 220)"/>
    <rect x="255" y="200" width="18" height="5" rx="2.5" transform="rotate(15 255 200)"/>
  </g>
  <!-- herbs -->
  <g fill="#5a7c3a">
    <circle cx="205" cy="190" r="3"/>
    <circle cx="185" cy="215" r="2.5"/>
    <circle cx="260" cy="225" r="3"/>
    <circle cx="130" cy="200" r="2.5"/>
    <circle cx="225" cy="255" r="2.5"/>
  </g>
</svg>
