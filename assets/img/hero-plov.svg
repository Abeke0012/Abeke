<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="hp-glow" cx="50%" cy="55%" r="60%">
      <stop offset="0" stop-color="#f3922e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f3922e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hp-kazan" cx="35%" cy="25%" r="80%">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="0.6" stop-color="#232323"/>
      <stop offset="1" stop-color="#0f0f0f"/>
    </radialGradient>
    <radialGradient id="hp-rice" cx="38%" cy="26%" r="75%">
      <stop offset="0" stop-color="#f8e4ab"/>
      <stop offset="0.6" stop-color="#e0aa54"/>
      <stop offset="1" stop-color="#b87c34"/>
    </radialGradient>
    <style>
      .steam-path path { animation: heroSteam 5.5s ease-in-out infinite; transform-origin: bottom center; }
      .steam-path path:nth-child(2) { animation-delay: 1.1s; }
      .steam-path path:nth-child(3) { animation-delay: 2.2s; }
      @keyframes heroSteam {
        0% { opacity: 0; transform: translateY(10px) scaleY(.9); }
        30% { opacity: .5; }
        100% { opacity: 0; transform: translateY(-24px) scaleY(1.12); }
      }
    </style>
  </defs>
  <ellipse cx="420" cy="440" rx="380" ry="380" fill="url(#hp-glow)"/>
  <!-- kazan (cauldron) rim -->
  <ellipse cx="420" cy="480" rx="330" ry="150" fill="url(#hp-kazan)"/>
  <ellipse cx="420" cy="440" rx="320" ry="130" fill="#151515"/>
  <ellipse cx="420" cy="430" rx="308" ry="118" fill="url(#hp-rice)"/>
  <!-- rice grain texture -->
  <g fill="#fbeecb" opacity="0.85">
    <circle cx="230" cy="410" r="4"/><circle cx="270" cy="380" r="3.6"/><circle cx="320" cy="430" r="4.2"/>
    <circle cx="370" cy="390" r="3.8"/><circle cx="420" cy="360" r="4"/><circle cx="470" cy="400" r="3.6"/>
    <circle cx="520" cy="380" r="4.2"/><circle cx="560" cy="420" r="3.8"/><circle cx="250" cy="450" r="4"/>
    <circle cx="310" cy="470" r="3.6"/><circle cx="380" cy="450" r="4.2"/><circle cx="450" cy="470" r="3.8"/>
    <circle cx="510" cy="450" r="4"/><circle cx="560" cy="460" r="3.6"/><circle cx="290" cy="500" r="4"/>
    <circle cx="360" cy="500" r="3.8"/><circle cx="440" cy="500" r="4"/><circle cx="510" cy="495" r="3.6"/>
  </g>
  <!-- carrot strips -->
  <g fill="#E08A3C">
    <rect x="260" y="370" width="50" height="12" rx="6" transform="rotate(18 260 370)"/>
    <rect x="380" y="350" width="55" height="12" rx="6" transform="rotate(-12 380 350)"/>
    <rect x="470" y="390" width="48" height="12" rx="6" transform="rotate(22 470 390)"/>
    <rect x="320" y="460" width="50" height="12" rx="6" transform="rotate(-16 320 460)"/>
    <rect x="440" y="470" width="52" height="12" rx="6" transform="rotate(12 440 470)"/>
  </g>
  <!-- raisins -->
  <g fill="#3a2418">
    <circle cx="300" cy="420" r="6"/><circle cx="370" cy="440" r="6"/><circle cx="430" cy="400" r="6"/>
    <circle cx="340" cy="480" r="6"/><circle cx="480" cy="440" r="6"/><circle cx="410" cy="500" r="6"/>
  </g>
  <!-- garlic bulb centerpiece -->
  <g transform="translate(420,370)">
    <ellipse cx="0" cy="10" rx="34" ry="42" fill="#f3e9d2"/>
    <path d="M0,-28 C12,-12 12,20 0,52 C-12,20 -12,-12 0,-28 Z" fill="#e8d9b0" opacity="0.7"/>
    <path d="M-18,-20 C-8,-4 -8,28 -18,44" stroke="#d8c496" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M18,-20 C8,-4 8,28 18,44" stroke="#d8c496" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
  <!-- meat pieces -->
  <ellipse cx="270" cy="360" rx="38" ry="26" fill="#8a4c28" transform="rotate(-12 270 360)"/>
  <ellipse cx="270" cy="352" rx="30" ry="16" fill="#a45f34" opacity="0.7" transform="rotate(-12 270 352)"/>
  <ellipse cx="540" cy="400" rx="34" ry="24" fill="#7a4326" transform="rotate(10 540 400)"/>
  <ellipse cx="540" cy="393" rx="26" ry="14" fill="#95562f" opacity="0.7" transform="rotate(10 540 393)"/>

  <!-- steam -->
  <g class="steam-path" fill="none" stroke="#f5efe0" stroke-width="9" stroke-linecap="round" opacity="0.45">
    <path d="M320,330 C300,280 350,250 330,200 C310,150 360,120 340,70"/>
    <path d="M480,320 C460,270 510,245 490,195 C470,145 520,115 500,60"/>
    <path d="M420,300 C400,255 440,225 425,180"/>
  </g>
</svg>
