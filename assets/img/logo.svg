<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="logoGold" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3D48B"/>
      <stop offset="0.5" stop-color="#C9A15A"/>
      <stop offset="1" stop-color="#9C7A3A"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="57" stroke="url(#logoGold)" stroke-width="2"/>
  <circle cx="60" cy="60" r="50" stroke="url(#logoGold)" stroke-width="1" opacity="0.6"/>
  <!-- eight-point star (girih) -->
  <g transform="translate(60,54)">
    <path d="M0,-16 L4.5,-4.5 L16,0 L4.5,4.5 L0,16 L-4.5,4.5 L-16,0 L-4.5,-4.5 Z" fill="url(#logoGold)" opacity="0.9"/>
    <path d="M0,-11 L11,-11 L11,11 L-11,11 Z" fill="none" stroke="url(#logoGold)" stroke-width="0.75" transform="rotate(45)" opacity="0.5"/>
  </g>
  <!-- piala (bowl) beneath the star -->
  <g transform="translate(60,78)">
    <path d="M-17,0 C-17,10 -9.5,17 0,17 C9.5,17 17,10 17,0 Z" fill="none" stroke="url(#logoGold)" stroke-width="2"/>
    <path d="M-14,0 C-8,3 8,3 14,0" stroke="url(#logoGold)" stroke-width="1" opacity="0.7"/>
    <line x1="-17" y1="0" x2="17" y2="0" stroke="url(#logoGold)" stroke-width="2"/>
  </g>
  <!-- crescent accents -->
  <path d="M28,40 a10,10 0 1 0 3,-13 a7.5,7.5 0 1 1 -3,13 Z" fill="url(#logoGold)" opacity="0.85"/>
  <text x="60" y="106" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="11" letter-spacing="3" fill="url(#logoGold)">ТОПЧАН</text>
</svg>
