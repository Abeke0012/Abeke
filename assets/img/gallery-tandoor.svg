<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -70 600 490">
  <defs>
    <radialGradient id="td-bg" cx="50%" cy="45%" r="80%">
      <stop offset="0" stop-color="#3a2418"/>
      <stop offset="1" stop-color="#160f0a"/>
    </radialGradient>
    <radialGradient id="td-fire" cx="50%" cy="80%" r="55%">
      <stop offset="0" stop-color="#ffdf8a"/>
      <stop offset="0.35" stop-color="#f3922e"/>
      <stop offset="0.7" stop-color="#c1502e"/>
      <stop offset="1" stop-color="#c1502e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="td-clay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3612f"/>
      <stop offset="0.5" stop-color="#c1793e"/>
      <stop offset="1" stop-color="#8a4f26"/>
    </linearGradient>
    <style>
      .flame { transform-origin: 300px 90px; animation: flameFlicker 1.4s ease-in-out infinite; }
      .flame-delay { animation-delay: .3s; animation-duration: 1.7s; }
      @keyframes flameFlicker {
        0%, 100% { transform: scaleY(1) scaleX(1) translateY(0); opacity: .9; }
        50% { transform: scaleY(1.12) scaleX(.94) translateY(-3px); opacity: 1; }
      }
      .smoke { animation: smokeRise 6s ease-in-out infinite; }
      @keyframes smokeRise {
        0% { opacity: 0; transform: translateY(20px) scale(.9); }
        30% { opacity: .35; }
        100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
      }
    </style>
  </defs>
  <rect x="0" y="-70" width="600" height="490" fill="url(#td-bg)"/>
  <ellipse cx="300" cy="330" rx="380" ry="120" fill="url(#td-fire)" opacity="0.5"/>
  <!-- brick floor -->
  <rect x="0" y="360" width="600" height="60" fill="#241a12"/>
  <g stroke="#3a2a1a" stroke-width="1" opacity="0.6">
    <line x1="0" y1="385" x2="600" y2="385"/>
    <line x1="40" y1="360" x2="40" y2="385"/><line x1="120" y1="360" x2="120" y2="385"/>
    <line x1="200" y1="360" x2="200" y2="385"/><line x1="280" y1="360" x2="280" y2="385"/>
    <line x1="360" y1="360" x2="360" y2="385"/><line x1="440" y1="385" x2="440" y2="410"/>
    <line x1="520" y1="360" x2="520" y2="385"/>
  </g>
  <!-- tandoor urn shape -->
  <path d="M215,370 C205,320 200,270 220,210 C232,175 210,150 230,110 C240,90 260,80 300,80 C340,80 360,90 370,110 C390,150 368,175 380,210 C400,270 395,320 385,370 Z" fill="url(#td-clay)"/>
  <ellipse cx="300" cy="370" rx="85" ry="16" fill="#5c3418"/>
  <ellipse cx="300" cy="108" rx="46" ry="16" fill="#5c3418"/>
  <ellipse cx="300" cy="104" rx="38" ry="12" fill="#160f0a"/>
  <!-- glow from opening -->
  <ellipse cx="300" cy="104" rx="30" ry="9" fill="url(#td-fire)"/>
  <!-- rope pattern rings -->
  <g stroke="#6e3f1e" stroke-width="4" fill="none" opacity="0.6">
    <path d="M218,220 C260,232 340,232 382,220"/>
    <path d="M212,280 C260,296 340,296 388,280"/>
    <path d="M225,160 C260,170 340,170 375,160"/>
  </g>
  <!-- flames rising from opening -->
  <g class="flame" fill="#f3922e" opacity="0.9">
    <path d="M285,100 C280,80 295,70 292,50 C305,65 310,80 300,95 C310,88 315,75 312,60 C325,75 322,95 305,100 Z"/>
  </g>
  <g class="flame flame-delay" fill="#ffdf8a" opacity="0.85">
    <path d="M300,98 C296,85 305,78 302,66 C312,76 314,88 305,96 Z"/>
  </g>
  <!-- smoke -->
  <g class="smoke" fill="none" stroke="#cfc7bd" stroke-width="5" stroke-linecap="round" opacity="0.35">
    <path d="M300,60 C290,40 315,25 305,0 C295,-20 320,-35 310,-55"/>
  </g>
  <!-- skewers leaning -->
  <line x1="150" y1="360" x2="185" y2="200" stroke="#c9a15a" stroke-width="4"/>
  <line x1="420" y1="360" x2="390" y2="195" stroke="#c9a15a" stroke-width="4"/>
</svg>
